[build-system]
requires = [
    "hatchling",
    "lcm==1.5.2",
    "pycapnp==2.2.2",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manor"]
artifacts = [
    "src/manor/common/definitions/lcmtypes/**/*",
]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hook.py"

[project]
name = "manor"
version = "0.1.0"
requires-python = ">=3.12"
authors = [{ name = "Shrenik", email = "shrenik95@gmail.com" }]
description = "Robotics manipulation research"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "attrs==24.2.0",
    "numpy==1.26.4",
    "drake==1.26.0",
    "pycapnp==2.2.2",
    "lcm==1.5.2",
    "pytest==8.3.2",
    "mock==5.1.0",
    "ruff==0.15.10",
    "pyyaml==6.0.2",
    "typer==0.25.0",
    "prompt-toolkit==3.0.48",
]

[project.optional-dependencies]
hardware = [
    "xarm-python-sdk==1.13.0",
]
ml = [
    "torch==2.4.0",
]

[project.scripts]
aegis = "manor.common.aegis.cli:cli"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "RUF100", "F401"]
fixable = ["I001", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
