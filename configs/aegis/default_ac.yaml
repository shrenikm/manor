# Canonical aegis config: Lite6 (parallel-gripper, normal trim) running
# in sim mode against the bundled lite6_table environment, with
# zero-velocity policy + zero-velocity controller as the bring-up
# default. Treat this file as the round-trip reference for the
# AegisConfig YAML schema -- top-level keys match the attrs field
# names of AegisConfig so adding a new field means adding a new key
# here too.

mode: sim

manipulator_model:
  type: lite6
  variant: parallel_gripper_normal

environment_config:
  manipulator_base_xyz: [0.0, 0.0, 0.7366]
  manipulator_base_rpy: [0.0, 0.0, 0.0]
  extra_models:
    - name: lite6_table
      description_filepath: environment/lite6_table.urdf
      base_xyz: [0.0, 0.0, 0.0]
      base_rpy: [0.0, 0.0, 0.0]
      weld_to_world: false

helios_config:
  publish_rgb_frequency_hz: 30.0
  publish_depth_frequency_hz: 30.0
  sim_backend_config:
    camera_id: default
  hardware_backend_config:
    serial_number: ""
    rgb_height: 480
    rgb_width: 640
    depth_height: 480
    depth_width: 640

talos_config:
  publish_frequency_hz: 100.0
  sim_backend_config: {}
  hardware_backend_config: {}

metis_config:
  publish_frequency_hz: 10.0
  policy_config:
    # Constant target matches Lite6JointConfiguration.PRIME so the sim
    # exercises a non-trivial joint-position action through the full
    # metis -> kyber -> talos -> gaia path.
    type: constant_joint_positions
    positions: [0.0, 0.1733, 0.5550, 0.0, 0.3817, 0.0]

kyber_config:
  publish_frequency_hz: 500.0
  controller_config:
    type: zero_velocity
    num_dof: 6

gaia_config:
  # Continuous-time integration: discrete-time TAMSI diverges on the
  # current unactuated stub plant under gravity. Performance comes
  # from the loose-tolerance integrator config in Gaia.finalize, not
  # from this knob.
  time_step: 0.0
  enable_meshcat: true
  target_realtime_rate: 1.0
  rgb_height: 480
  rgb_width: 640
  depth_height: 480
  depth_width: 640

gaia_advancer_config:
  # 100 Hz is plenty: meshcat re-renders at ~64 Hz internally, talos
  # polls at 200 Hz against whatever-the-latest-gaia-state-is, and
  # the integration cost lives in time_step (above) regardless of how
  # often we ask for an advance.
  advance_frequency_hz: 100.0
