mode: sim

manipulator_model:
  type: rebot_b601_dm
  variant: parallel_gripper

environment_config:
  manipulator_base_xyz: [0.0, 0.0, 0.7366]
  manipulator_base_rpy: [0.0, 0.0, 0.0]
  extra_models:
    - name: rebot_b601_dm_table
      description_filepath: environment/rebot_b601_dm_table.urdf
      base_xyz: [0.0, 0.0, 0.0]
      base_rpy: [0.0, 0.0, 0.0]
      weld_to_world: false

helios_config:
  publish_rgb_frequency_hz: 30.0
  publish_depth_frequency_hz: 30.0
  sim_backend_config:
    camera_id: default
  hardware_backend_config:
    serial_number: ""
    rgb_height: 480
    rgb_width: 640
    depth_height: 480
    depth_width: 640

talos_config:
  publish_frequency_hz: 100.0
  sim_backend_config:
    minimum_watchdog_frequency_hz: 3.0
  hardware_backend_config:
    minimum_watchdog_frequency_hz: 3.0
    rebot_b601_dm_driver_config:
      joint_speed_limit_rad_s: 0.5
      # Clamp on how far a streamed position command may lead the measured position. In the default MIT
      # arm mode this is the arm's torque bound (about kp * clamp per joint); the arm yields on contact
      # instead of winding up to full torque like a firmware position loop would.
      max_command_error_rad: 0.15
      # FORCE_POS torque ceiling for every gripper command, as a fraction of max motor torque. The gripper
      # linkage is 3D printed and full torque breaks it; the vendor's LeRobot integration grips at 0.07.
      gripper_torque_ratio: 0.07
      # mit (default, torque-bounded streaming; what the official LeRobot teleop uses) or pos_vel (firmware
      # position cascade; accurate for planned motion but unbounded torque on contact).
      arm_control_mode: mit
  stale_command_watchdog_config:
    publish_frequency_hz: 100.0

metis_config:
  publish_frequency_hz: 10.0
  policy_type: constant_joint_velocities

kyber_config:
  publish_frequency_hz: 500.0
  controller_type: ik_passthrough

gaia_config:
  time_step: 0.0
  enable_meshcat: true
  target_realtime_rate: 1.0
  rgb_height: 480
  rgb_width: 640
  depth_height: 480
  depth_width: 640

gaia_advancer_config:
  advance_frequency_hz: 100.0
